# Project overrides on top of the detekt default rule set (buildUponDefaultConfig = true).
build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreAnnotation: true
    ignoreAnnotated: ["Composable", "Preview"]
  ReturnCount:
    max: 3
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"]

complexity:
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
    ignoreAnnotated: ["Composable"]
  LongMethod:
    ignoreAnnotated: ["Composable", "Preview"]
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable", "Test", "Preview"]
