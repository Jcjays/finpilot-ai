name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: ci
      AI_PROVIDER: mock
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/finpilot_test
      TEST_DATABASE_USER: finpilot_migrator
      TEST_DATABASE_PASSWORD: finpilot_migrator_ci_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot_migrator
          POSTGRES_PASSWORD: finpilot_migrator_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot_migrator -d finpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (detekt)
        run: ./gradlew detekt --console=plain

      - name: Test
        run: ./gradlew test --console=plain

      - name: Build fat jar
        run: ./gradlew :app:buildFatJar --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          if-no-files-found: ignore
