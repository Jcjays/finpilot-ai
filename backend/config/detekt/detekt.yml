# Project overrides on top of the detekt default rule set (buildUponDefaultConfig = true).
build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreAnnotation: true
  ReturnCount:
    max: 3

complexity:
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    ignoreDeprecated: true

naming:
  FunctionNaming:
    ignoreAnnotated: ["Test", "ParameterizedTest"]
