ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.finpilot.app.ApplicationKt.module ]
  }
}

finpilot {
  # local | ci | prod
  env = "local"
  env = ${?APP_ENV}

  auth {
    # Supabase project URL (local CLI stack by default). JWKS and issuer are derived from it:
    #   issuer = <supabaseUrl>/auth/v1, jwks = <supabaseUrl>/auth/v1/.well-known/jwks.json
    supabaseUrl = "http://127.0.0.1:54321"
    supabaseUrl = ${?SUPABASE_URL}
    audience = "authenticated"
    # Legacy/local HS256 secret. Accepted ONLY when env = local; startup fails if it is set elsewhere.
    hs256Secret = ""
    hs256Secret = ${?AUTH_HS256_SECRET}
    leewaySeconds = 30
  }

  ai {
    # mock | claude
    provider = "mock"
    provider = ${?AI_PROVIDER}
  }
}
