ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.finpilot.app.ApplicationKt.module ]
  }
}

finpilot {
  # local | ci | prod
  env = "local"
  env = ${?APP_ENV}

  auth {
    # Supabase project URL (local CLI stack by default). JWKS and issuer are derived from it:
    #   issuer = <supabaseUrl>/auth/v1, jwks = <supabaseUrl>/auth/v1/.well-known/jwks.json
    supabaseUrl = "http://127.0.0.1:54321"
    supabaseUrl = ${?SUPABASE_URL}
    audience = "authenticated"
    # Legacy/local HS256 secret. Accepted ONLY when env = local; startup fails if it is set elsewhere.
    hs256Secret = ""
    hs256Secret = ${?AUTH_HS256_SECRET}
    leewaySeconds = 30
  }

  database {
    # Least-privilege API role. Absent url = no database (allowed only outside prod).
    # Supabase Free: use the SESSION pooler, e.g. jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    poolSize = 4
    poolSize = ${?DATABASE_POOL_SIZE}
  }

  ai {
    # mock | claude
    provider = "mock"
    provider = ${?AI_PROVIDER}
  }
}
